<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5" />
            <stop offset="100%" stop-color="#7c3aed" />
        </linearGradient>
        <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
        <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="50%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#c084fc" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Squircle Icon Background -->
    <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

    <!-- Building & Receptionist Arch -->
    <g filter="url(#glow)">
        <!-- Main Tower -->
        <rect x="17" y="16" width="20" height="34" rx="3" fill="#ffffff" fill-opacity="0.96" />
        
        <!-- Side Wing Tower -->
        <rect x="37" y="24" width="10" height="26" rx="2" fill="#ffffff" fill-opacity="0.75" />

        <!-- Windows Grid on Main Tower -->
        <rect x="21" y="21" width="4" height="4" rx="1" fill="#4f46e5" />
        <rect x="29" y="21" width="4" height="4" rx="1" fill="#4f46e5" />
        <rect x="21" y="28" width="4" height="4" rx="1" fill="#4f46e5" />
        <rect x="29" y="28" width="4" height="4" rx="1" fill="#4f46e5" />

        <!-- Windows on Side Wing -->
        <rect x="40" y="28" width="4" height="3" rx="0.8" fill="#6366f1" />
        <rect x="40" y="34" width="4" height="3" rx="0.8" fill="#6366f1" />

        <!-- Grand Lobby Entrance Door -->
        <path d="M24 50V39C24 37.8954 24.8954 37 26 37H32C33.1046 37 34 37.8954 34 39V50H24Z" fill="url(#doorGrad)" />

        <!-- Flow Dynamic Stream (LobbyFlow Wave) -->
        <path d="M10 51C17 51 22 46 30 46C38 46 43 53 54 53" stroke="url(#flowGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />

        <!-- Smart Pass Signal Beacon -->
        <circle cx="48" cy="16" r="3.5" fill="#38bdf8" />
        <circle cx="48" cy="16" r="6" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 2" fill="none" />
    </g>
</svg>
